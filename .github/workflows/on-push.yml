name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Run pre-commit and deptry
      run: make check-code

  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Install the GDAL command line tools
      run: sudo apt-get update && sudo apt-get install -y gdal-bin
    - name: Run unit tests
      run: make unit-tests COV_REPORT=xml

  test-on-windows:
    needs: [run-unit-tests]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install the GDAL command line tools and make
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: gdal
        create-args: >-
          gdal
          make
        init-shell: bash
        cache-environment: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Run unit tests
      # login shell so that the micromamba environment is activated
      shell: bash -el {0}
      run: make unit-tests COV_REPORT=xml

  check-typing:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Run type checks
      run: make check-typing

  build-docs:
    needs: [run-unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Build documentation
      run: make build-docs

  test-minimum-python:
    needs: [run-unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
        python-version: '3.11'
    - name: Install the GDAL command line tools
      run: sudo apt-get update && sudo apt-get install -y gdal-bin
    - name: Run unit tests with the minimum supported python version
      run: make unit-tests COV_REPORT=xml

  test-minimum-versions:
    needs: [run-unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
        python-version: '3.11'
    - name: Install the GDAL command line tools
      run: sudo apt-get update && sudo apt-get install -y gdal-bin
    - name: Run tests with the minimum supported versions
      run: make test-minimum-versions

  build-distribution:
    needs: [check-code, check-typing, test-on-windows, test-minimum-python, test-minimum-versions]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        enable-cache: true
    - name: Build distribution
      run: uv build
    - name: Check distribution
      run: |
        uvx twine check --strict dist/*
        uv run --isolated --no-project --with dist/elevation-*.whl python -c "import elevation"
    - uses: actions/upload-artifact@v7
      with:
        name: distribution
        path: dist

  upload-to-pypi:
    needs: [build-distribution, build-docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elevation
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publish

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: distribution
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        verbose: true
