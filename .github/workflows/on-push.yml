name: on-push

on: [push]

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install pytest pytest-cov pytest-mock
    - name: Test with pytest
      run: pytest -v --cov=. --cov-report=xml .
    - name: Upload coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install pytest sphinx sphinx_rtd_theme
        sudo apt-get update
        sudo apt-get install --yes gdal-bin
    - name: Build documentation with Sphinx
      run: sphinx-build -q -b html docs _build/html
    - name: Test README with pytest
      run: pytest -q --doctest-glob="*.rst" README.rst

  code-quality:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  code-style:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Check code style with black
      run: |
        python -m pip install black
        black --check .
    - name: Check code style with isort
      run: |
        python -m pip install isort
        isort --check-only .

  distribution:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish a Python distribution to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}
