name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - uses: pre-commit/action@v3.0.1

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.11.17'
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install the GDAL command line tools
      run: sudo apt-get install -y gdal-bin

    - name: Run unit tests
      run: make unit-tests COV_REPORT=xml

  check-typing:
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.11.17'
        enable-cache: true
        python-version: '3.14'
    - name: Run type checks
      run: make check-typing

  docs-build:
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.11.17'
        enable-cache: true
        python-version: '3.14'
    - name: Build documentation
      run: make docs-build

  minver-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.11.17'
        enable-cache: true
        python-version: '3.14'

    - name: Install the GDAL command line tools
      run: sudo apt-get install -y gdal-bin

    - name: Run tests
      run: make minver-tests

  distribution:
    runs-on: ubuntu-latest
    needs: [unit-tests, check-typing, docs-build]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build distribution
      run: |
        python -m build
    - name: Check wheels
      working-directory: dist
      run: |
        python -m pip install elevation*.whl
        python -m twine check --strict *
        python -c "import elevation"
    - uses: actions/upload-artifact@v7
      with:
        name: distribution
        path: dist

  upload-to-pypi:
    runs-on: ubuntu-latest
    needs: distribution
    if: |
      always() &&
      needs.distribution.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags')
    environment:
      name: pypi
      url: https://pypi.org/p/elevation
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publish

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: distribution
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        verbose: true
