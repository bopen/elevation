[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools_scm>=8"]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "myst-parser>=4.0.1",
  "pre-commit>=4.3.0",
  "pydata-sphinx-theme>=0.16.1",
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "pytest-mock>=3.16.0",
  "ruff>=0.15",
  "sphinx>=7.2",
  "sphinx-autoapi>=3.6.0"
]

[project]
authors = [
  {name = "Alessandro Amici"},
  {name = "B-Open"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "appdirs>=1.4.4",
  "fasteners>=0.18",
  "fsspec[http]>=2024.6.0",
  "rioxarray>=0.18",
  "typer>=0.26.7"
]
description = "Download, cache and clip global terrain digital elevation models: Mapzen terrain tiles, SRTM 30m and 90m DEMs."
dynamic = ["version"]
keywords = [
  "DEM",
  "DTM",
  "SRTM",
  "digital elevation",
  "download",
  "geospatial",
  "global",
  "terrain model",
  "terrain tiles"
]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "elevation"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
reference = ["fiona>=1.8.22", "rasterio>=1.3.4"]

[project.scripts]
eio = "elevation.__main__:app"

[project.urls]
Homepage = "https://elevation.bopen.eu"
Repository = "https://github.com/bopen/elevation"
Sponsor = "https://bopen.eu"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["appdirs", "fasteners", "fiona", "fsspec", "rasterio", "rasterio.*"]

[tool.ruff]
# Same as Black.
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = [
  # pydocstyle: Missing Docstrings
  "D1",
  # flake8-bugbear: Mutable argument defaults are safe if not mutated
  "B006",
  # flake8-bugbear: typer.Option is called in argument defaults by design
  "B008"
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pydocstyle
  "D",
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # flake8-use-pathlib
  "PTH",
  # flake8-simplify
  "SIM",
  # pyupgrade
  "UP",
  # Ruff-specific rules
  "RUF"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools]
packages = ["elevation"]

[tool.setuptools.package-data]
elevation = ["datasource.mk", "datasets/*.yaml", "py.typed"]

[tool.setuptools_scm]
fallback_version = "999"
write_to = "elevation/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
