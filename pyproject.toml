[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm>=8"]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.3.0",
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "pytest-mock>=3.16.0",
  "ruff>=0.15",
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0"
]

[project]
authors = [
  { name = "B-Open Solutions srl, Alessandro Amici", email = "info@bopen.eu" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "appdirs>=1.4.4",
  "click>=8.1.3",
  "fasteners>=0.18"
]
description = "Python script to download global terrain digital elevation models, SRTM 30m DEM and SRTM 90m DEM."
dynamic = ["version"]
keywords = [
  "script",
  "download",
  "SRTM",
  "DEM",
  "DTM",
  "global",
  "digital elevation",
  "terrain model"
]
license = { file = "LICENSE" }
name = "elevation"
readme = "README.rst"
requires-python = ">=3.11"

[project.optional-dependencies]
reference = ["fiona>=1.8.22", "rasterio>=1.3.4"]

[project.scripts]
eio = "elevation.cli:eio"

[project.urls]
Homepage = "https://elevation.bopen.eu"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["appdirs", "fasteners", "fiona", "rasterio"]

[tool.ruff]
# Same as Black.
indent-width = 4
line-length = 88

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = [
  # pydocstyle: Missing Docstrings
  "D1"
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pydocstyle
  "D"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools]
packages = ["elevation"]

[tool.setuptools.package-data]
elevation = ["datasource.mk", "py.typed"]

[tool.setuptools_scm]
fallback_version = "999"
write_to = "elevation/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
