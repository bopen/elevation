id: srtm3
title: SRTM global 90m v4.1
description: 'Void-filled, seamless Shuttle Radar Topography Mission (SRTM) 3 arc second (90 m) surface heights on the EGM96 geoid, over land between 60°N and 60°S, mosaicked into 5° x 5° tiles by CGIAR-CSI (CIAT and JRC) from the NASA/USGS SRTM data. The heights are a surface model: vegetation and buildings contribute to them. Redistribution and commercial resale require written permission from CIAT.'
license: other
extent:
  spatial:
    bbox:
    - - -180
      - -60
      - 180
      - 60
  temporal:
    interval:
    - - '2000-02-11T00:00:00Z'
      - '2000-02-22T00:00:00Z'
version: '4.1'
sci:citation: Jarvis A., H.I. Reuter, A. Nelson, E. Guevara, 2008, Hole-filled seamless SRTM data V4, International Centre for Tropical Agriculture (CIAT), available from https://srtm.csi.cgiar.org
