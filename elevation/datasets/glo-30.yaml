id: glo-30
title: Copernicus DEM global 30m
description: 'Copernicus DEM GLO-30: global 1 arc second (30 m) Digital Surface Model (DSM) on the EGM2008 geoid, acquired by the TanDEM-X mission (2011-2015) and derived from the edited WorldDEM DSM. It represents the top-reflective surface, so buildings, infrastructure and vegetation are included; water bodies are flattened and coastlines, airports and implausible structures are edited. Ocean areas have no tiles. Distributed by the Earth Data Hub (DESTINE) as Cloud Optimized GeoTIFFs.'
