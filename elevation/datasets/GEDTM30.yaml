description: 'Global Ensemble Digital Terrain Model (GEDTM30) 1 arc second (30 m) bare-earth heights on the EGM2008 geoid, produced by OpenGeoHub fusing Copernicus DEM, ALOS World 3D and other global DEMs with a random forest model trained on ICESat-2 and GEDI ground elevations. Unlike a surface model, vegetation and buildings are removed. It is a machine learning product: the producers advise to verify it before critical use. Version 1.2, distributed by OpenTopography as a single cloud-optimized GeoTIFF that is read in place, one 1° x 1° window at a time. Antarctica is not covered.'
