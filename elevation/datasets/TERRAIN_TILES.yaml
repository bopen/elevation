id: TERRAIN_TILES
title: Terrain Tiles global 30m v1
version: '1'
summaries:
  gsd:
  - 30
  proj:code:
  - EPSG:9707
extent:
  spatial:
    bbox:
    - - -180
      - -90
      - 180
      - 90
  temporal:
    interval:
    - - '2000-02-11T00:00:00Z'
      - '2016-12-31T00:00:00Z'
license: other
description: "Global mosaic of 1 arc second (30 m) surface heights assembled by the Mapzen joerd pipeline from SRTM and other open DEMs (3DEP, EUDEM, ArcticDEM, GMTED2010, ETOPO1 and more), re-referenced to the EGM96 geoid and distributed as gzip-compressed SRTM HGT tiles (the Mapzen 'skadi' format). The heights are a surface model: on land they include vegetation and buildings, and over the ocean they carry ETOPO1 bathymetry."
providers:
- name: Mapzen, a Linux Foundation project
  roles:
  - processor
  - host
  url: https://registry.opendata.aws/terrain-tiles/
- name: NASA and NGA (SRTM), USGS (3DEP, GMTED2010), EEA (EU-DEM), NOAA (ETOPO1)
  roles:
  - producer
  url: https://github.com/tilezen/joerd/blob/master/docs/data-sources.md
type: Collection
stac_version: 1.1.0
stac_extensions:
- https://stac-extensions.github.io/projection/v2.1.0/schema.json
- https://stac-extensions.github.io/version/v1.2.0/schema.json
links:
