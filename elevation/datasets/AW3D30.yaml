description: 'ALOS World 3D (AW3D30) 1 arc second (30 m) surface heights on the EGM96 geoid, averaged by JAXA from the 5 m AW3D DSM produced with the stereo images of the PRISM optical sensor of the Advanced Land Observing Satellite (ALOS, 2006-2011). Version 3.2, distributed as 1° x 1° GeoTIFF tiles by OpenTopography. The heights are a surface model: vegetation and buildings contribute to them. Ocean areas have no tiles.'
