id: srtm1-geoid
title: SRTM global 30m v3
description: 'Void-filled Shuttle Radar Topography Mission (SRTM) 1 arc second (30 m) surface heights on the EGM96 geoid, over land between 60°N and 56°S. These are the NASA MEaSUREs SRTMGL1 v003 (SRTM version 3) data, distributed as 1° x 1° GeoTIFF tiles by OpenTopography. The heights are a surface model: vegetation and buildings contribute to them, and over water bodies the elevation is flattened.'
license: other
